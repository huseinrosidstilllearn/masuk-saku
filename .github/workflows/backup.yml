name: Weekly encrypted backup
on:
  schedule:
    - cron: '0 19 * * 0'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y age rclone
      - shell: bash
        env:
          PGHOST: ${{ secrets.BACKUP_PGHOST }}
          PGPORT: ${{ secrets.BACKUP_PGPORT }}
          PGUSER: ${{ secrets.BACKUP_PGUSER }}
          PGPASSWORD: ${{ secrets.BACKUP_PGPASSWORD }}
          PGDATABASE: postgres
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: bash scripts/backup.sh
      - name: Upload encrypted backup to Google Drive
        if: vars.BACKUP_DRIVE_ENABLED == 'true'
        shell: bash
        env:
          BACKUP_RCLONE_CONFIG: ${{ secrets.BACKUP_RCLONE_CONFIG }}
        run: bash scripts/upload-backup-drive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: encrypted-weekly-backup
          path: backups/*.age
          retention-days: 90
          if-no-files-found: error
