name: Verify foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: node --test tests/backup-drive.test.mjs tests/backup-storage.test.mjs
      - run: npm run check
      - run: npm run format:check
      - run: node scripts/check-public-source.mjs
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: npm run test:auth -- --workers=1
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check --config supabase/functions/deno.json supabase/functions/ai-credentials/index.ts supabase/functions/ai-preview/index.ts supabase/functions/ai-confirm/index.ts supabase/functions/attachment-upload/index.ts supabase/functions/maintenance/index.ts supabase/functions/username-login/index.ts
      - run: deno test --config supabase/functions/deno.json --allow-env supabase/functions/_shared/
