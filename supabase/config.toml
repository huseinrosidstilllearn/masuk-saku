project_id = "masuk-saku"
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 10000
[db]
port = 54322
major_version = 17
[studio]
enabled = true
port = 54323
[auth]
enabled = true
site_url = "https://masuk-saku-development.pages.dev"
additional_redirect_urls = ["https://masuk-saku-development.pages.dev", "http://127.0.0.1:5173", "http://localhost:5173"]
enable_signup = true
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.external.google]
enabled = false
client_id = "env(GOOGLE_CLIENT_ID)"
secret = "env(GOOGLE_CLIENT_SECRET)"
[storage]
enabled = true
file_size_limit = "10MiB"
[functions.ai-credentials]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.ai-preview]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.ai-confirm]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.attachment-upload]
import_map = "./functions/deno.json"
verify_jwt = false
[functions.maintenance]
import_map = "./functions/deno.json"
verify_jwt = false
# Each user function verifies the JWT using Auth getUser inside the handler.
# Maintenance uses a separate high-entropy bearer secret, never a user token.
[functions.username-login]
import_map = "./functions/deno.json"
verify_jwt = false
# Public login verifies credentials via Auth; private resolution and quota are server-only.
